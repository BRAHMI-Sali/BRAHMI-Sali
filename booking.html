<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Patient Appointment Booking</title>
    <link rel="stylesheet" href="styles.css" />
</head>

<body>
    <div class="booking-card">
        <div class="booking-header">
            <h2>Book Your Appointment</h2>
            <p>Please fill in your details below</p>
        </div>

        <form id="bookingForm" enctype="multipart/form-data" novalidate>
            <div class="form-group">
                <label for="firstName">First Name *</label>
                <input type="text" id="firstName" name="firstName" required />
                <small class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="lastName">Last Name *</label>
                <input type="text" id="lastName" name="lastName" required />
                <small class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="email">Email *</label>
                <input type="email" id="email" name="email" required />
                <small class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number *</label>
                <input type="tel" id="phone" name="phone" required pattern="^\+?[0-9\s\-]{7,15}$"
                    placeholder="+1234567890" />
                <small class="error-message"></small>
            </div>

            <div class="form-group">
                <label for="idCard">Identity Card (PDF) *</label>
                <input type="file" id="idCard" name="idCard" accept="application/pdf" required />
                <small class="error-message"></small>
            </div>

            <div class="form-actions">
                <button type="button" id="cancelBtn">Cancel</button>
                <button type="submit" id="bookBtn">Book</button>
            </div>
        </form>

        <div id="successMessage" class="hidden">
            <h3>Booking Successful!</h3>
            <p>Your appointment has been booked. We will contact you soon.</p>
        </div>
    </div>

    <script src="booking.js"></script>
</body>

</html>
